<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StartCode - Assistente IA para Codificação</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            padding: 20px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid #1e293b;
            padding-bottom: 15px;
        }
        h1 {
            font-size: 1.5rem;
            color: #38bdf8;
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
        .panel {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        h2 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #e2e8f0;
        }
        textarea {
            width: 100%;
            height: 150px;
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #f8fafc;
            padding: 12px;
            font-size: 1rem;
            resize: vertical;
            margin-bottom: 15px;
        }
        textarea:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #0ea5e9;
        }
        pre {
            background-color: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 15px;
            height: 250px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            color: #34d399;
            font-size: 0.95rem;
            white-space: pre-wrap;
        }
        .explanation-box {
            margin-top: 20px;
            background-color: #1e293b;
            border-radius: 12px;
            padding: 20px;
            grid-column: span 2;
        }
        .explanation-content {
            color: #cbd5e1;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <header>
        <h1>StartCode - Assistente IA para Codificação de Arduino</h1>
    </header>

    <div class="container">
        <!-- Painel Esquerdo: Entrada do Aluno -->
        <div class="panel">
            <h2>Escreva sua ideia aqui</h2>
            <textarea id="promptInput" placeholder="Ex: Quero um código para acender um led na porta d7..."></textarea>
            <button id="generateBtn" onclick="gerarCodigo()">Gerar código com Start IA ⚡</button>
        </div>

        <!-- Painel Direito: Código C++ Gerado -->
        <div class="panel">
            <h2>💻 Código C++ (Para colar na IDE do Arduino)</h2>
            <pre id="codeOutput">// O código gerado aparecerá aqui...</pre>
        </div>

        <!-- Painel Inferior: Explicação Didática -->
        <div class="explanation-box">
            <h2>💡 Entendendo o código</h2>
            <div id="explanationOutput" class="explanation-content">
                A explicação didática para o aluno aparecerá aqui...
            </div>
        </div>
    </div>

    <script>
        async function gerarCodigo() {
            const prompt = document.getElementById('promptInput').value.trim();
            const codeOutput = document.getElementById('codeOutput');
            const explanationOutput = document.getElementById('explanationOutput');
            const btn = document.getElementById('generateBtn');

            if (!prompt) {
                alert('Por favor, escreva uma ideia ou instrução para o código.');
                return;
            }

            try {
                btn.disabled = true;
                btn.innerText = 'A gerar código inteligente...';
                codeOutput.innerText = '// A gerar código inteligente...';
                explanationOutput.innerHTML = 'A estruturar a explicação didática para o aluno...';

                // Requisição assíncrona para a API do servidor (compatível com Vercel e Render)
                const response = await fetch('/api/gerar-codigo', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ prompt })
                });

                const data = await response.json();

                if (data.success) {
                    codeOutput.innerText = data.code;
                    explanationOutput.innerHTML = data.explanation;
                } else {
                    codeOutput.innerText = '// Erro ao gerar código.';
                    explanationOutput.innerHTML = `<span style="color: #f87171;">${data.error || 'Erro desconhecido'}</span>`;
                }

            } catch (error) {
                console.error('Erro na requisição:', error);
                codeOutput.innerText = '// Erro de conexão com o servidor.';
                explanationOutput.innerHTML = '<span style="color: #f87171;">Não foi possível comunicar com o servidor de IA.</span>';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Gerar código com Start IA ⚡';
            }
        }
    </script>
</body>
</html>
