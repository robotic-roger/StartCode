
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#071426">
  <title>StartCode | Start Maker</title>

  <style>
    :root {
      color-scheme: dark;
      --bg: #071426;
      --panel: #101f35;
      --panel2: #0b192b;
      --blue: #1684ff;
      --yellow: #ffcc00;
      --text: #f2f6ff;
      --muted: #a9b8ce;
      --border: #263954;
      --green: #54d69a;
      --red: #ff7b7b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 22px;
      border-bottom: 1px solid var(--border);
      background: #09182b;
    }

    .header-inner, main {
      width: min(1100px, calc(100% - 32px));
      margin: auto;
    }

    .brand {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .brand span { color: var(--yellow); }

    .subtitle {
      margin-top: 6px;
      color: var(--muted);
      font-size: 14px;
    }

    main { padding: 28px 0 50px; }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    h2 {
      margin: 0 0 14px;
      font-size: 19px;
    }

    label {
      display: block;
      margin-bottom: 10px;
      font-weight: 700;
    }

    textarea {
      width: 100%;
      min-height: 125px;
      padding: 15px;
      resize: vertical;
      color: var(--text);
      background: var(--panel2);
      border: 1px solid var(--border);
      border-radius: 9px;
      font: inherit;
      line-height: 1.6;
    }

    textarea:focus {
      outline: 2px solid var(--blue);
      outline-offset: 1px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 14px;
    }

    button {
      border: 0;
      border-radius: 8px;
      padding: 12px 17px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 750;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .6;
    }

    .primary {
      background: var(--yellow);
      color: #172033;
    }

    .secondary {
      background: #20334d;
      color: var(--text);
      border: 1px solid #354b68;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--muted);
      font-size: 14px;
      margin-top: 16px;
      min-height: 22px;
    }

    .dot {
      width: 9px;
      height: 9px;
      background: var(--green);
      border-radius: 50%;
      flex-shrink: 0;
    }

    .dot.loading {
      background: var(--yellow);
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { opacity: .35; }
      to { opacity: 1; }
    }

    .results {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .result-panel { min-width: 0; }

    .result-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
    }

    .result-heading h2 { margin: 0; }

    pre {
      margin: 0;
      min-height: 200px;
      max-height: 650px;
      overflow: auto;
      padding: 17px;
      background: #06111f;
      border: 1px solid var(--border);
      border-radius: 9px;
      color: #d8e7ff;
      white-space: pre;
      font: 13px/1.65 Consolas, Monaco, monospace;
      tab-size: 2;
    }

    .explanation {
      min-height: 200px;
      line-height: 1.75;
      overflow-wrap: anywhere;
    }

    .explanation h3 { color: var(--yellow); }

    .explanation code {
      background: #06111f;
      padding: 2px 5px;
      border-radius: 4px;
    }

    .explanation ul, .explanation ol { padding-left: 23px; }

    .empty {
      color: #8294ad;
      font-style: italic;
    }

    .error { color: var(--red); }

    .small {
      color: var(--muted);
      font-size: 12px;
      margin-top: 12px;
    }

    @media (max-width: 760px) {
      .results { grid-template-columns: 1fr; }
      .panel { padding: 16px; }
      header { padding: 18px 0; }
      .brand { font-size: 24px; }
    }
  </style>
</head>

<body>
  <header>
    <div class="header-inner">
      <div class="brand">Start<span>Code</span></div>
      <div class="subtitle">Assistente de programação para robótica educacional</div>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>O que vamos construir?</h2>

      <label for="prompt">Descreva seu projeto Arduino</label>
      <textarea
        id="prompt"
        placeholder="Ex.: Crie um programa para acender um LED no pino 13 durante um segundo e apagá-lo durante outro segundo."
      ></textarea>

      <div class="actions">
        <button class="primary" id="generate">Gerar projeto</button>
        <button class="secondary" id="clear">Limpar</button>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">
        <span class="dot"></span>
        <span>Pronto para começar.</span>
      </div>
    </section>

    <section class="results">
      <article class="panel result-panel">
        <div class="result-heading">
          <h2>Código Arduino</h2>
          <button class="secondary" id="copyCode">Copiar código</button>
        </div>

        <pre><code id="code" aria-live="polite" class="empty">Seu código aparecerá aqui.</code></pre>
        <div class="small">Código C++ para Arduino.</div>
      </article>

      <article class="panel result-panel">
        <div class="result-heading">
          <h2>Explicação didática</h2>
          <button class="secondary" id="copyExplanation">Copiar texto</button>
        </div>

        <div id="explanation" class="explanation empty" aria-live="polite">
          A explicação aparecerá aqui.
        </div>
      </article>
    </section>
  </main>

  <script>
    const promptInput = document.getElementById('prompt');
    const generateButton = document.getElementById('generate');
    const clearButton = document.getElementById('clear');
    const codeElement = document.getElementById('code');
    const explanationElement = document.getElementById('explanation');
    const statusElement = document.getElementById('status');

    let gerando = false;

    function atualizarStatus(mensagem, carregando = false, erro = false) {
      statusElement.replaceChildren();

      const dot = document.createElement('span');
      dot.className = carregando ? 'dot loading' : 'dot';

      if (erro) dot.style.background = 'var(--red)';

      const texto = document.createElement('span');
      texto.textContent = mensagem;

      statusElement.append(dot, texto);
    }

    function mostrarCodigo(codigo) {
      codeElement.textContent = codigo;
      codeElement.classList.remove('empty');
    }

    function mostrarExplicacao(html) {
      // Exibe HTML gerado pelo modelo. Scripts e handlers são removidos.
      const documento = new DOMParser().parseFromString(html, 'text/html');

      documento.querySelectorAll(
        'script, iframe, object, embed, form, input, button, link, meta, style'
      ).forEach(elemento => elemento.remove());

      documento.body.querySelectorAll('*').forEach(elemento => {
        [...elemento.attributes].forEach(atributo => {
          if (
            atributo.name.toLowerCase().startsWith('on') ||
            ['src', 'href', 'srcdoc', 'formaction'].includes(atributo.name.toLowerCase())
          ) {
            elemento.removeAttribute(atributo.name);
          }
        });
      });

      explanationElement.innerHTML = documento.body.innerHTML;
      explanationElement.classList.remove('empty');
    }

    function definirBotoes(carregando) {
      gerando = carregando;
      generateButton.disabled = carregando;
      clearButton.disabled = carregando;
      generateButton.textContent = carregando ? 'Gerando...' : 'Gerar projeto';
    }

    async function gerarProjeto() {
      const prompt = promptInput.value.trim();

      if (!prompt) {
        atualizarStatus('Descreva o projeto antes de gerar.', false, true);
        promptInput.focus();
        return;
      }

      definirBotoes(true);
      mostrarCodigo('Aguardando o código...');
      codeElement.classList.add('empty');
      explanationElement.textContent = 'Preparando a explicação...';
      explanationElement.classList.add('empty');
      atualizarStatus('Conectando ao StartCode...', true);

      try {
        const resposta = await fetch('/api/gerar-codigo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ prompt })
        });

        if (!resposta.ok) {
          let mensagem = 'Não foi possível iniciar a geração.';

          try {
            const erro = await resposta.json();
            mensagem = erro.error || mensagem;
          } catch (_) {}

          throw new Error(mensagem);
        }

        if (!resposta.body) {
          throw new Error('O navegador não recebeu um fluxo de resposta.');
        }

        const reader = resposta.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let recebeuCodigo = false;
        let recebeuExplicacao = false;

        while (true) {
          const { value, done } = await reader.read();

          if (done) break;

          buffer += decoder.decode(value, { stream: true });

          const linhas = buffer.split('\n');
          buffer = linhas.pop() || '';

          for (const linha of linhas) {
            if (!linha.trim()) continue;

            let evento;

            try {
              evento = JSON.parse(linha);
            } catch (_) {
              continue;
            }

            if (evento.type === 'status') {
              atualizarStatus(evento.message || 'Gerando...', true);
            }

            if (evento.type === 'code' && evento.code) {
              mostrarCodigo(evento.code);
              recebeuCodigo = true;
              atualizarStatus(
                recebeuExplicacao
                  ? 'Código e explicação recebidos.'
                  : 'Código recebido. Preparando a explicação...',
                true
              );
            }

            if (evento.type === 'explanation' && evento.explanation) {
              mostrarExplicacao(evento.explanation);
              recebeuExplicacao = true;
              atualizarStatus(
                recebeuCodigo
                  ? 'Código recebido. Finalizando...'
                  : 'Preparando a explicação...',
                true
              );
            }

            if (evento.type === 'complete') {
              mostrarCodigo(evento.code);
              mostrarExplicacao(evento.explanation);
              recebeuCodigo = true;
              recebeuExplicacao = true;
            }

            if (evento.type === 'error') {
              throw new Error(evento.error || 'Erro durante a geração.');
            }
          }
        }

        if (buffer.trim()) {
          try {
            const evento = JSON.parse(buffer);

            if (evento.type === 'complete') {
              mostrarCodigo(evento.code);
              mostrarExplicacao(evento.explanation);
              recebeuCodigo = true;
              recebeuExplicacao = true;
            } else if (evento.type === 'error') {
              throw new Error(evento.error || 'Erro durante a geração.');
            }
          } catch (erro) {
            if (erro instanceof Error && erro.message !== 'Unexpected end of JSON input') {
              throw erro;
            }
          }
        }

        if (!recebeuCodigo || !recebeuExplicacao) {
          throw new Error('A resposta terminou antes de todos os resultados chegarem. Tente novamente.');
        }

        atualizarStatus('Projeto gerado com sucesso.');
      } catch (erro) {
        console.error('[StartCode]', erro);
        atualizarStatus(erro.message || 'Ocorreu um erro na geração.', false, true);

        if (!codeElement.textContent || codeElement.textContent === 'Aguardando o código...') {
          mostrarCodigo('Não foi possível gerar o código.');
          codeElement.classList.add('empty');
        }

        if (
          !explanationElement.textContent ||
          explanationElement.textContent === 'Preparando a explicação...'
        ) {
          explanationElement.textContent = 'Tente novamente. Se o problema persistir, consulte os logs da Vercel.';
          explanationElement.classList.add('empty');
        }
      } finally {
        definirBotoes(false);
      }
    }

    generateButton.addEventListener('click', gerarProjeto);

    promptInput.addEventListener('keydown', evento => {
      if ((evento.ctrlKey || evento.metaKey) && evento.key === 'Enter' && !gerando) {
        gerarProjeto();
      }
    });

    clearButton.addEventListener('click', () => {
      promptInput.value = '';
      codeElement.textContent = 'Seu código aparecerá aqui.';
      codeElement.classList.add('empty');
      explanationElement.textContent = 'A explicação aparecerá aqui.';
      explanationElement.classList.add('empty');
      atualizarStatus('Pronto para começar.');
      promptInput.focus();
    });

    document.getElementById('copyCode').addEventListener('click', async () => {
      const codigo = codeElement.textContent;

      if (!codigo || codeElement.classList.contains('empty')) {
        atualizarStatus('Ainda não há código para copiar.', false, true);
        return;
      }

      try {
        await navigator.clipboard.writeText(codigo);
        atualizarStatus('Código copiado.');
      } catch (_) {
        atualizarStatus('Não foi possível copiar. Selecione o código e copie manualmente.', false, true);
      }
    });

    document.getElementById('copyExplanation').addEventListener('click', async () => {
      const texto = explanationElement.innerText;

      if (!texto || explanationElement.classList.contains('empty')) {
        atualizarStatus('Ainda não há explicação para copiar.', false, true);
        return;
      }

      try {
        await navigator.clipboard.writeText(texto);
        atualizarStatus('Explicação copiada.');
      } catch (_) {
        atualizarStatus('Não foi possível copiar a explicação.', false, true);
      }
    });
  </script>
</body>
</html>
